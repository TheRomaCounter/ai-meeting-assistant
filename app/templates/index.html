<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Meeting Assistant</title>
    <style>
        body {
            background-color: #111827;
            color: #f3f4f6;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 24px;
        }
        .container {
            max-width: 650px;
            width: 100%;
            background-color: #1f2937;
            border-radius: 12px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            padding: 32px;
            border: 1px solid #374151;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(to right, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            color: #9ca3af;
            text-align: center;
            margin-bottom: 32px;
        }
        .dropzone {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 128px;
            border: 2px dashed #4b5563;
            border-radius: 8px;
            cursor: pointer;
            background-color: #374151;
            transition: background-color 0.2s;
        }
        .dropzone:hover {
            background-color: #4b5563;
        }
        .dropzone p {
            margin: 4px 0;
            font-size: 14px;
        }
        .btn {
            width: 100%;
            background: linear-gradient(to right, #3b82f6, #10b981);
            color: white;
            font-weight: bold;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 24px;
            transition: opacity 0.2s;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .status {
            margin-top: 32px;
            padding: 16px;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
        }
        .status-loading { background-color: rgba(30, 58, 138, 0.5); color: #93c5fd; border: 1px solid #1e40af; }
        .status-processing { background-color: rgba(120, 53, 4, 0.5); color: #fde047; border: 1px solid #854d0e; }
        .status-error { background-color: rgba(127, 29, 29, 0.5); color: #fca5a5; border: 1px solid #991b1b; }
        .results { margin-top: 32px; }
        .block {
            padding: 20px;
            background-color: #374151;
            border-radius: 8px;
            margin-bottom: 24px;
        }
        .block-summary { border-left: 4px solid #10b981; }
        .block-transcript { border-left: 4px solid #3b82f6; }
        .block h3 { margin-top: 0; margin-bottom: 8px; font-size: 18px; }
        .text-summary { color: #34d399; }
        .text-transcript { color: #60a5fa; }
        .content { color: #d1d5db; line-height: 1.6; margin: 0; }
        .hidden { display: none; }
        
        .history-section {
            margin-top: 32px;
            border-top: 1px solid #374151;
            padding-top: 24px;
        }
        .history-title { font-size: 20px; font-weight: 700; margin-bottom: 16px; color: #e5e7eb; }
        .history-list { display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto; }
        .history-item {
            background-color: #374151;
            padding: 12px 16px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid transparent;
            transition: background-color 0.2s;
        }
        .history-item:hover { background-color: #4b5563; border-color: #4b5563; }
        .badge { font-size: 12px; padding: 2px 8px; border-radius: 12px; font-weight: 600; }
        .badge-completed { background-color: rgba(16, 185, 129, 0.2); color: #34d399; }
        .badge-processing { background-color: rgba(234, 179, 8, 0.2); color: #fde047; }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Meeting Assistant</h1>
        <div class="subtitle">Upload meeting audio to get instant transcript and AI summary</div>

        <form id="uploadForm">
            <label class="dropzone">
                <p style="font-weight: 600; color: #e5e7eb;">Click to upload file</p>
                <p style="color: #9ca3af; font-size: 12px;">Supported formats: MP3, WAV, M4A</p>
                <input id="audioFile" type="file" accept=".mp3,.wav,.m4a" style="display: none;" required />
            </label>
            <button type="submit" class="btn">Process Audio</button>
        </form>

        <div id="statusBlock" class="status hidden"></div>

        <div id="resultBlock" class="results hidden">
            <div class="block block-summary">
                <h3 class="text-summary">✨ AI Summary</h3>
                <p id="summaryText" class="content"></p>
            </div>
            <div class="block block-transcript">
                <h3 class="text-transcript">📝 Full Transcript</h3>
                <p id="transcriptText" class="content" style="white-space: pre-line;"></p>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">📜 History</div>
            <div id="historyList" class="history-list"></div>
        </div>
    </div>

    <!-- Подключаем наш внешний скрипт -->
    <script src="/static/main.js"></script>
</body>
</html>
