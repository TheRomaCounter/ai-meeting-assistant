services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./shared_data:/app/shared_data
      - ./.env:/app/.env
    env_file:
      - .env
    depends_on:
      - db
      - redis

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: ai_assistant_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_ai_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_ai_data:/data

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.worker.celery_app worker --loglevel=info
    volumes:
      - ./app:/app/app
      - ./shared_data:/app/shared_data
      - ./.env:/app/.env
    env_file:
      - .env
    depends_on:
      - redis
      - db

volumes:
  postgres_ai_data:
  redis_ai_data:
